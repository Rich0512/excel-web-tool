<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找不到頁面 - 延平國小社團課表整理工具</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --primary: #0f3b6d;
            --bg: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2ecc71;
            --accent-hover: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .error-card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .error-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: var(--accent);
            color: white;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-home:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-icon">🔍</span>
        <h1 class="error-title">找不到此頁面</h1>
        <p class="error-desc">
            您所訪問的頁面不存在或已被移除。<br>
            請點擊下方按鈕回到社團課表整理工具的主頁面。
        </p>
        <a href="./" class="btn-home">🏠 回到首頁</a>
    </div>
    <div class="footer-note">
        延平國小社團課表整理工具 - 網頁版
    </div>
</body>
</html>
